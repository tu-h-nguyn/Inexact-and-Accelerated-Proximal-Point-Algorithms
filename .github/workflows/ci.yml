name: CI

on:
  # Pushes to a branch with an open pull request already fire a pull_request
  # event, so listening to both would run every job twice.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_01/requirements.txt pytest ruff
      - name: Lint
        run: python -m ruff check .
      - name: Test
        run: python -m pytest

  reproduce:
    name: the Python experiment still reproduces exactly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_01/requirements.txt
      - name: Re-run the experiment
        run: cd test_01 && python run_experiment.py
      # This experiment is a deterministic 1-D recursion in plain numpy: no RNG
      # and no parallel reduction, so it really does reproduce byte for byte.
      # (The MATLAB experiment does not -- see the `bounds` job below.)
      - name: Fail if the committed numbers are stale
        run: git diff --exit-code -- test_01/results.csv test_01/summary.csv
      - uses: actions/upload-artifact@v4
        with:
          name: figures
          path: test_01/figures/*

  bounds:
    name: the convergence bounds hold numerically
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Octave
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends octave
      # MATLAB and Octave use different random number generators, so the same
      # seed gives a different problem instance and byte-comparison would be
      # meaningless. verify_bounds.m therefore checks the claims that must hold
      # for EVERY instance -- the bounds of Theorem 3.2 at every outer
      # iteration, the theorem's own admissibility hypothesis, and the closed
      # form identities -- rather than reproducing particular numbers.
      - name: Check the bounds
        run: cd matlab && octave --no-gui --quiet --eval "exit(~verify_bounds())"
