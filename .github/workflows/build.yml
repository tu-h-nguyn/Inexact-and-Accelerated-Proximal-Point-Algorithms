name: build

# Biên dịch toàn bộ tài liệu LaTeX và chạy lại thực nghiệm số.
# PDF + hình + bảng số liệu được tải lên dưới dạng artifact của mỗi lần chạy.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  latex:
    name: Biên dịch tài liệu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài TeX Live
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-other texlive-lang-european \
            texlive-science latexmk lmodern

      - name: Build báo cáo, slide, kịch bản, tiểu luận
        run: make all

      - name: Build ghi chú đọc bài báo
        run: make notes

      - name: Kiểm tra không còn tham chiếu / trích dẫn treo
        run: |
          status=0
          for log in main.log slide.log transcript.log essay/essay.log docs/ghi-chu-bai-bao.log; do
            if grep -qE "Warning: (Citation|Reference).*undefined" "$log"; then
              echo "::error file=$log::Còn tham chiếu hoặc trích dẫn chưa được giải quyết"
              grep -E "Warning: (Citation|Reference).*undefined" "$log" | sort -u
              status=1
            fi
          done
          exit $status

      - uses: actions/upload-artifact@v4
        with:
          name: pdf
          path: |
            main.pdf
            slide.pdf
            transcript.pdf
            essay/essay.pdf
            docs/ghi-chu-bai-bao.pdf

  numerics:
    name: Thực nghiệm số + kiểm chứng (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài phụ thuộc
        run: pip install -r code/python/requirements.txt

      - name: Lint
        run: pip install ruff && python -m ruff check .
      - name: Kiểm chứng số học (bước này ĐƯỢC PHÉP làm đỏ CI)
        run: make test

      - name: Chạy lại hai thực nghiệm
        run: make figures

      - name: Báo cáo sai lệch so với kết quả đã commit
        run: git --no-pager diff --stat -- results figures || true

      - uses: actions/upload-artifact@v4
        with:
          name: numerics
          path: |
            figures/*.png
            results/*.csv

  bounds:
    name: Chặn hội tụ vẫn đúng (Octave)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # MATLAB va Octave dung hai bo sinh so ngau nhien khac nhau, nen cung mot
      # hat giong van cho hai thuc the bai toan khac nhau: so tung chu so se do
      # ngay khi doi moi truong ma khong bat duoc loi that nao. verify_bounds.m
      # kiem nhung dieu phai dung tren MOI thuc the -- chan cua Dinh ly 3.2 tai
      # moi buoc lap ngoai, gia thiet cua chinh dinh ly, va cac dang thuc dong.
      # gnuplot-nox va bo font la BAT BUOC cho buoc ve hinh: `octave` cai voi
      # --no-install-recommends khong keo theo backend do hoa nao, va Octave se
      # bao "no graphics toolkits are available!" ngay khi goi figure().
      - name: Cài Octave
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            octave gnuplot-nox fonts-dejavu-core fontconfig
          fc-cache -f
      - name: Kiểm chứng chặn hội tụ
        run: cd code/matlab && octave --no-gui --quiet --eval "exit(~verify_bounds())"
      # Chay ca script thuc nghiem duoi Octave. Phan VE HINH cua Octave hong
      # tren ca hai moi truong da thu (ft_text_renderer khong nap duoc font),
      # nen script tu phat hien va bo qua phan do thi -- nhung PHAN TINH TOAN
      # phai chay tron ven va in ra dung ket qua. Do la dieu buoc nay kiem.
      - name: Chạy thực nghiệm dưới Octave (phần tính toán)
        run: |
          set -e
          cd code/matlab
          octave --no-gui --quiet --eval "main_experiment" | tee /tmp/out.txt
          grep -q "Vi pham chan Loai 1 (S4): 0 / 121" /tmp/out.txt
          grep -q "Vi pham chan Loai 2 (S4): 0 / 121" /tmp/out.txt
          echo "phan tinh toan chay duoc duoi Octave, khong vi pham chan nao"
