[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: re-runs an experiment from scratch rather than reading its committed output",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["tests", "test_01"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]
